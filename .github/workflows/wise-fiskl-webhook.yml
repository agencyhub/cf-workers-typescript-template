name: Wise Fiskl webhook

on:
  push:
    paths:
      - "wise-fiskl-webhook/**"
      - ".github/workflows/wise-fiskl-webhook.yml"
  pull_request:
    paths:
      - "wise-fiskl-webhook/**"
      - ".github/workflows/wise-fiskl-webhook.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wise-fiskl-webhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wise-fiskl-webhook/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler types
      - run: npx tsc --noEmit
